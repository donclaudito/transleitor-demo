name: Publicar a demonstração no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Conferir e construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Conferências estáticas
        run: npm run conferir

      - name: Prova de renderização das telas
        run: npm run smoke

      - name: Build
        # O Pages serve o projeto em /<nome-do-repo>/. O prefixo vem daqui, não do código.
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Sem .nojekyll, o Jekyll do Pages ignora arquivos e pastas que começam com "_".
      - name: Desligar o Jekyll
        run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
