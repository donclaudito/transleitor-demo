<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- ÍCONE DA MARCA: o arquivo oficial do emblema Oren.AI, recortado e com fundo transparente
         por `gerar-icones-oren.py`. O Vite reescreve estes caminhos se o site for servido em
         subpasta (GitHub Pages), então eles podem ficar na forma absoluta. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/oren-ai-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/oren-ai-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/oren-ai-180.png" />
    <!-- TIPOGRAFIA — carregada AQUI, e não com `@import` dentro do CSS.
         `@import` dentro de folha de estilo é render-blocking e serializa a descoberta:
         o navegador precisa baixar o nosso CSS para só então descobrir que existe outro CSS de
         fonte para baixar. Com <link> os dois pedidos saem em paralelo, e o `preconnect` já abre a
         conexão com o Google Fonts antes de o CSS chegar.

         DUAS FAMÍLIAS, E SÓ DUAS:
           - Instrument Serif -> a serifa display da CAPA;
           - Poppins          -> as PÁGINAS DA DEMONSTRAÇÃO (a sans geométrica da referência).
         Inter e Sora saíram: nada mais as usa, e fonte que ninguém usa é pedido desperdiçado. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@300;400;500;600;700;800&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transleitor — demonstração navegável do aplicativo de documentação clínica com IA. Página de apresentação do produto: as telas são ilustrativas e não executam nenhuma função." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6d5ae8" />
    <title>Transleitor — Documentação clínica com IA</title>
    <!--
      ROTA PROFUNDA NO GITHUB PAGES (por que isto existe):
      O GitHub Pages serve arquivos, não rotas: um F5 em /demo/evolucao não encontra arquivo e cai no
      404.html, que devolve para cá com o caminho em ?r=. Este trecho restaura o caminho ANTES de o
      React montar, para o roteador já nascer na tela certa. Sem isto, recarregar uma tela da
      demonstração mostraria "página não encontrada".
    -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var destino = params.get('r');
        if (!destino) return;
        params.delete('r');
        var resto = params.toString();
        window.history.replaceState(
          null,
          '',
          decodeURIComponent(destino) + (resto ? '?' + resto : '') + window.location.hash
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
