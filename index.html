    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23907cff'/%3E%3Cstop offset='1' stop-color='%235b5bd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M20 12v13a9 9 0 0 0 18 0V12' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M29 34l6 5' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='43.5' cy='42.5' r='8' stroke='white' stroke-width='5' fill='none'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Transleitor — demonstração navegável do aplicativo de documentação clínica com IA. Página de apresentação do produto: as telas são ilustrativas e não executam nenhuma função." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6d5ae8" />
    <title>Transleitor — Documentação clínica com IA</title>
    <!--
      ROTA PROFUNDA NO GITHUB PAGES (por que isto existe):
      O GitHub Pages serve arquivos, não rotas: um F5 em /demo/evolucao não encontra arquivo e cai no
      404.html, que devolve para cá com o caminho em ?r=. Este trecho restaura o caminho ANTES de o
      React montar, para o roteador já nascer na tela certa. Sem isto, recarregar uma tela da
      demonstração mostraria "página não encontrada".
    -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var destino = params.get('r');
        if (!destino) return;
        params.delete('r');
        var resto = params.toString();
        window.history.replaceState(
          null,
          '',
          decodeURIComponent(destino) + (resto ? '?' + resto : '') + window.location.hash
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
